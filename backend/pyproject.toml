[project]
name = "kisanbot-backend"
version = "0.1.0"
description = "Backend scaffold for KisanBot AI agricultural chatbot."
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<2.1",
    "pydantic",
    "python-jose",
    "passlib[bcrypt]",
    "python-multipart",
    "requests",
    "python-dotenv",
    "langdetect",
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-huggingface",
    "langchain-openai",
    "langchain-pinecone",
    "langchain-text-splitters",
    "openai",
    "pillow",
    "pdfplumber",
    "pymupdf",
    "pinecone",
    "reportlab",
    "sarvamai",
    "slowapi",
    "transformers",
    "httpx",
    "pytest"
]

[tool.poetry]
name = "kisanbot-backend"
version = "0.1.0"
